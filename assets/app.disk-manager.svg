<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="diskGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0F1A12;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#080E0A;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#5ED684;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00E676;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background plate -->
  <rect x="50" y="50" width="412" height="412" rx="64" fill="url(#diskGradient)" stroke="#5ED684" stroke-width="4" opacity="0.8"/>
  
  <!-- Disk platter -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="#5ED684" stroke-width="32"/>
  <circle cx="256" cy="256" r="120" fill="none" stroke="#00E676" stroke-width="24"/>
  
  <!-- Disk head/arm -->
  <path d="M180 240 L280 240 L280 200 L320 220 L320 260 L280 280 Z" fill="#A7F3D0"/>
  
  <!-- Center indicator -->
  <circle cx="256" cy="256" r="24" fill="#38BDF8"/>
  
  <!-- Decorative elements -->
  <circle cx="256" cy="256" r="8" fill="#FFFFFF"/>
</svg>
